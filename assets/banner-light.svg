.bglow { fill: #0891b2; opacity: 0; animation: fadeto2 .4s ease .55s both, breathe 2.6s ease-in-out 1.2s infinite alternate; }
.spark { fill: none; stroke: #0891b2; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; animation: spark 6.5s linear 3.2s infinite; }
.bflash { fill: #ffffff; opacity: 0; animation: spark 6.5s linear 3.2s infinite; }
.gp { fill: none; stroke-width: 8.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 2; animation: draw .6s cubic-bezier(.65,0,.25,1) both; }
.c-dim { stroke: #0b0d14; opacity: .6; } .c-dimf { fill: #0b0d14; opacity: .6; }
.c-hi { stroke: #0b0d14; }
.c-x { stroke: #0891b2; } .c-o { stroke: #7c3aed; }
.dot { transform-box: fill-box; transform-origin: center; animation: popdim .35s cubic-bezier(.2,1.5,.35,1) both; }
.mark { transform-box: fill-box; transform-origin: center; animation: mark .5s cubic-bezier(.2,1.6,.4,1) both; }
.tag { font-size: 15px; font-weight: 650; letter-spacing: 4.2px; fill: #4b5374; animation: rise .7s ease 2.6s both; }
