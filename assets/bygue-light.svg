<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }

.eyebrow { font-size: 12.5px; letter-spacing: 4px; fill: #4b5374; }
.title { font-size: 30px; font-weight: 800; fill: #0b0d14; letter-spacing: -.3px; }
.sub { font-size: 15px; fill: #4b5374; }
.ell { fill: none; stroke: #98a1c4; stroke-opacity: .35; stroke-dasharray: 2 9; animation: ell 40s linear infinite; }
.link { fill: none; stroke: #98a1c4; stroke-opacity: .55; stroke-width: 1.2; }
.link.soon { stroke-dasharray: 4 6; stroke-opacity: .45; }
.link.ghost { stroke-dasharray: 2 6; stroke-opacity: .3; }
.halo { opacity: .16; transform-box: fill-box; transform-origin: center; animation: halo 3s ease-in-out infinite; }
.node { transform-box: fill-box; transform-origin: center; animation: nodein .5s cubic-bezier(.2,1.5,.35,1) both; }
.lbl { animation: fadein .6s ease both; }
.name { font-size: 16px; font-weight: 700; fill: #0b0d14; }
.ghostt { fill: #4b5374; font-style: italic; }
.desc { font-size: 12.5px; fill: #4b5374; }
.knock { paint-order: stroke; stroke: #fbfcff; stroke-width: 6px; stroke-linejoin: round; }
.hubt { font-size: 21px; font-weight: 800; fill: #0b0d14; letter-spacing: -.2px; }
.hubs { font-size: 12px; fill: #4b5374; letter-spacing: .4px; }
.orb { fill: none; stroke: #98a1c4; stroke-opacity: .55; stroke-dasharray: 3 7; transform-origin: 600px 330px; animation: spin 24s linear infinite; }
.hp { fill: none; stroke: #0891b2; stroke-width: 1.5; opacity: 0; transform-origin: 600px 330px; animation: hp 3.2s ease-out infinite; }
.foot { font-size: 12.5px; fill: #4b5374; letter-spacing: 1px; }
.foot .acc { fill: #0891b2; }
@keyframes ell { to { stroke-dashoffset: -330 } }
@keyframes halo { 0%, 100% { transform: scale(1); opacity: .14 } 50% { transform: scale(1.5); opacity: .3 } }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes hp { 0% { opacity: .7; transform: scale(1) } 100% { opacity: 0; transform: scale(1.9) } }
@keyframes nodein { from { opacity: 0; transform: scale(.2) } to { opacity: 1; transform: scale(1) } }
@keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
