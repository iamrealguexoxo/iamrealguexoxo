.sbr { fill: none; stroke: #1e1b4b; stroke-width: 1.7; stroke-linecap: round; stroke-dasharray: 1 2; animation: draw .12s linear .5s both; }
.flash { fill: #0891b2; opacity: 0; animation: flash .9s ease-out .52s both; }
.shock { fill: none; stroke: #0891b2; stroke-width: 2.5; opacity: 0; transform-origin: 600px 150px; animation: shock 1.1s cubic-bezier(.15,.6,.3,1) .55s both; }
.ring { fill: none; stroke: url(#grad); stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 2; animation: draw .85s cubic-bezier(.65,0,.25,1) .62s both; }
.rglow { fill: none; stroke: url(#grad); stroke-width: 16; stroke-linecap: round; opacity: 0; animation: fadeto3 .9s ease 1.25s both; }
@keyframes fadeto3 { from { opacity: 0 } to { opacity: 0.25 } }
.orbit { fill: none; stroke: #ffffff; stroke-width: 4; stroke-linecap: round; stroke-dasharray: .07 .93; opacity: 0; animation: orbit 3.4s linear 1.7s infinite, fadeto .4s ease 1.7s both; }
