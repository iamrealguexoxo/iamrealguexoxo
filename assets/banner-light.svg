.leader { fill: none; stroke: #1e1b4b; stroke-width: 1.4; opacity: 0; animation: leader .34s linear .1s both; }
.strike { opacity: 0; animation: strikefade .62s ease-out .42s both; }
.sb { fill: none; stroke: #1e1b4b; stroke-width: 3.6; stroke-linecap: round; stroke-dasharray: 1 2; animation: draw .13s linear .42s both; }
